apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-observability
  namespace: argocd
spec:
  project: github-arc-runners
  destination:
    namespace: observability
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/OWNER/REPOSITORY.git
    targetRevision: main
    path: k8s-github-arc-runners/charts/arc-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
