name: ARC scaling demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scale-out:
    strategy:
      fail-fast: false
      matrix:
        job: [1, 2, 3, 4, 5]
    runs-on: arc-demo-runners
    steps:
      - name: Show ephemeral runner
        shell: bash
        run: |
          echo "matrix job: ${{ matrix.job }}"
          echo "runner: $RUNNER_NAME"
          echo "os: $RUNNER_OS"
          sleep 30
