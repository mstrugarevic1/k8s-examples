# Helm release namespace: arc-runners-organization-b
githubConfigUrl: https://github.com/organization-b
githubConfigSecret: organization-b-github-pat
runnerScaleSetName: organization-b-runners
runnerGroup: default
minRunners: 0
maxRunners: 5
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller
template:
  spec:
    containers:
      - name: runner
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 1Gi}
